spring.application.name=j1-curation
server.port=8080

# 모델 서버 (model/server.py). 같은 PC에서만 부르고 바깥에 공개하지 않습니다.
j1.model-server-url=http://127.0.0.1:8001
# 첫 추천은 300장 기준 30초~2분이 걸려 넉넉히 둡니다
j1.model-timeout=5m

# 업로드한 사진을 세션별로 두는 폴더. 모델 서버의 --root와 같아야 합니다.
j1.upload-root=./data/uploads
# 업로드 사진을 지우기까지의 시간 (마지막 사용 기준)
j1.upload-ttl=6h
# 서버 PC의 폴더 경로로 앨범을 여는 기능 (시연 PC에서만 true)
j1.allow-local-folder=false
# 프론트엔드 개발 서버 주소 (CORS). 쉼표로 여러 개
j1.cors-origins=http://localhost:5173,http://127.0.0.1:5173

# 편집 실험 기록 CSV(/api/admin/curations.csv)용 토큰. 비워 두면 내보내기가 꺼집니다.
# 실제 값은 저장소에 넣지 말고 환경 변수 J1_ADMIN_TOKEN으로 줍니다.
j1.admin-token=${J1_ADMIN_TOKEN:}

# 업로드 크기 (휴대폰 원본 기준)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=2GB

# 보관함 DB (파일 H2). 다른 DB로 바꾸려면 아래 세 줄만 바꿉니다.
spring.datasource.url=jdbc:h2:file:./data/j1db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
